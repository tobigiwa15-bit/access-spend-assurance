# Descriptions and tests for the staging models. dbt docs shows the descriptions;
# dbt build runs the tests after building each model.
version: 2

models:
  - name: stg_employees
    description: >
      HR roster with types applied and personal data protected. Names and emails
      are dropped; IDs and bank accounts are pseudonymised with a keyed hash.
      Known residual risk: a job title such as "Head of IT" belongs to one person,
      so it could identify them to someone inside the company. It is kept because
      checks and the agent need to know an approver's seniority.
    columns:
      - name: employee_hash
        description: Keyed hash of the employee ID. The key for this person in every model.
        data_tests:
          - unique
          - not_null
      - name: manager_hash
        description: Keyed hash of the line manager's employee ID. Empty for heads of department.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
      - name: department
        data_tests:
          - not_null
      - name: job_title
      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["permanent", "contractor"]
      - name: hire_date
        data_tests:
          - not_null
      - name: termination_date
        description: Last working day. Empty for people still employed.
      - name: bank_account_masked
        description: Salary account number with all but the last four digits hidden.
      - name: bank_account_hash
        description: Keyed hash of the full salary account number, for matching against vendors.
        data_tests:
          - unique
          - not_null

  - name: stg_hr_events
    description: Joiner, mover, leaver and rehire events, with the employee pseudonymised.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: employee_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["joiner", "mover", "leaver", "rehire"]
      - name: event_date
        data_tests:
          - not_null

  - name: stg_roles
    description: Role catalogue for core banking, the payments console and the ERP.
    columns:
      - name: role
        data_tests:
          - unique
          - not_null
      - name: system
        data_tests:
          - accepted_values:
              arguments:
                values: ["core_banking", "payments_console", "erp"]
      - name: is_privileged
        description: True for administrator roles, which can change system settings or other users' access.
        data_tests:
          - not_null
      - name: sod_function
        description: What the role lets you do, for segregation of duties. Empty if the role has no SoD relevance.

  - name: stg_sod_rules
    description: Pairs of functions one person must not hold together, even across systems.
    columns:
      - name: function_a
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roles')
                field: sod_function
      - name: function_b
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roles')
                field: sod_function

  - name: stg_role_matrix
    description: The roles each department should have at each level (staff, lead, head, and IT admin).
    columns:
      - name: role
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roles')
                field: role
      - name: level
        data_tests:
          - accepted_values:
              arguments:
                values: ["staff", "lead", "head", "admin"]

  - name: stg_accounts
    description: One account per person per system. Usernames are dropped because they are built from names.
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: employee_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
      - name: system
        data_tests:
          - accepted_values:
              arguments:
                values: ["core_banking", "payments_console", "erp"]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "disabled"]

  - name: stg_access_grants
    description: Every role ever granted, with approver (pseudonymised), approval, grant and removal dates.
    columns:
      - name: grant_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: role
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roles')
                field: role
      - name: grant_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["standard", "emergency"]
      - name: approver_hash
        description: >
          Keyed hash of the approver's employee ID. Empty when there is no approval on
          record, which is exactly what one of the checks looks for, so it is not tested
          as not_null. The relationships test ignores empty values.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
      - name: granted_date
        data_tests:
          - not_null
      - name: revoked_date
        description: Day the access was removed. Empty while it is still open.

  - name: stg_logins
    description: Each account's first sign-in of the day over the 90 days to the as-of date.
    columns:
      - name: login_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

  - name: stg_vendors
    description: >
      Vendor master file. Bank accounts are masked and hashed with the same macros
      as employees, so vendors and employees can be compared on bank_account_hash
      without anyone seeing a full account number.
    columns:
      - name: vendor_id
        data_tests:
          - unique
          - not_null
      - name: vendor_name
        data_tests:
          - not_null
      - name: billing
        data_tests:
          - accepted_values:
              arguments:
                values: ["ad hoc", "monthly"]
      - name: bank_account_hash
        description: >
          Keyed hash of the full account number. Not tested as unique: two vendors
          sharing an account is something to investigate, not a data error.
        data_tests:
          - not_null
      - name: created_by_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
      - name: approved_by_hash
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash

  - name: stg_purchase_orders
    description: Purchase orders in the audit period, with requester and approver pseudonymised.
    columns:
      - name: po_id
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vendors')
                field: vendor_id
      - name: amount
        data_tests:
          - not_null
      - name: requested_by_hash
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
      - name: approved_by_hash
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash

  - name: stg_invoices
    description: Supplier invoices in the audit period, with the AP clerk pseudonymised.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vendors')
                field: vendor_id
      - name: po_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_purchase_orders')
                field: po_id
      - name: vendor_invoice_number
        description: >
          The vendor's own invoice number. Not tested as unique: a repeated number
          is what the duplicate-invoice check looks for.
      - name: amount
        data_tests:
          - not_null
      - name: entered_by_hash
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash

  - name: stg_payments
    description: Supplier payments in the audit period, with the approver pseudonymised.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        description: >
          Every payment must go to a known vendor. Together, these two tests are the
          plan's "no payment without a vendor" rule.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vendors')
                field: vendor_id
      - name: invoice_id
        description: >
          Empty when a payment has no invoice. That is a control finding for the
          checks, so it is not tested as not_null; the relationships test ignores
          empty values.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_invoices')
                field: invoice_id
      - name: amount
        data_tests:
          - not_null
      - name: approved_by_hash
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_hash
