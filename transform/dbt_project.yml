# The dbt project: what it's called, where things live, and how each layer is built.
name: access_spend_assurance
version: "1.0.0"
profile: access_spend_assurance   # the connection to use, defined in profiles.yml

model-paths: ["models"]
test-paths: ["tests"]

# Settings every check shares, from "Facts every rule can rely on" in
# inventory/check_rules.md. Models read them with {{ var('as_of_date') }}, so
# each one is written down once.
vars:
  as_of_date: "2026-09-30"      # "today" for every check
  review_start: "2024-10-01"    # first day of the review period
  approval_limit: 5000000       # the most a Procurement team lead may approve on one PO
  rounding_tolerance: 1         # naira allowed for rounding before a payment counts as more than its invoice

# Don't send anonymous usage statistics to dbt Labs.
flags:
  send_anonymous_usage_stats: false

# How each folder of models is built. "+schema" adds a suffix to the dataset
# named in profiles.yml (asa), so the layers land in separate datasets:
#   asa_staging       cleaned, typed and masked copies of the raw tables
#   asa_intermediate  joins across tables, e.g. a person's access in every system
#   asa_checks        one table per check, listing its exceptions
models:
  access_spend_assurance:
    staging:
      +schema: staging
      # Tables, not views. A BigQuery view needs read access to the tables under
      # it, so masked views over asa_raw would force us to give the agent access
      # to raw personal data. As tables, the masked data stands on its own.
      +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: view    # built only from masked staging tables
    checks:
      +schema: checks
      +materialized: table   # a fixed list of exceptions to score and investigate
